[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopgrid-verify"
version = "0.1.0"
description = "Standalone offline verifier for LoopGrid evidence bundles"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "LoopGrid" }
]
keywords = [
  "ai-agents",
  "evidence",
  "verification",
  "audit",
  "cryptography",
  "ed25519",
  "tamper-evident"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "cryptography>=42,<47",
  "asn1crypto>=1.5,<2"
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "twine>=5,<8"
]

[project.scripts]
loopgrid-verify = "loopgrid_verify.cli:main"

[project.urls]
Homepage = "https://loopgrid.io"
Repository = "https://github.com/loopgridio/loopgrid-verify"
Issues = "https://github.com/loopgridio/loopgrid-verify/issues"
Documentation = "https://github.com/loopgridio/loopgrid-verify#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
